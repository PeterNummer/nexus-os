
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS OS</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg,#173b70,#101b3c,#315d91);
    user-select: none;
}

.desktop {
    height: 100vh;
    padding: 20px;
}

.desktop-icon {
    width: 85px;
    padding: 12px 5px;
    text-align: center;
    cursor: pointer;
    border-radius: 8px;
}

.desktop-icon:hover { background: #ffffff25; }
.desktop-icon .symbol { font-size: 35px; }
.desktop-icon p { font-size: 13px; margin: 5px 0; }

.taskbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 58px;
    background: #101a2de8;
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-top: 1px solid #ffffff20;
    z-index: 10000;
}

.task-button {
    border: none;
    background: transparent;
    color: white;
    font-size: 23px;
    width: 43px;
    height: 43px;
    border-radius: 9px;
    cursor: pointer;
}

.task-button:hover,
.task-button.active {
    background: #ffffff25;
}

.task-button.active::after {
    content: "";
    display: block;
    width: 15px;
    height: 3px;
    margin: 1px auto 0;
    background: #56b4ff;
    border-radius: 5px;
}

.open-apps {
    display: flex;
    gap: 5px;
    align-items: center;
}

.clock {
    position: absolute;
    right: 18px;
    font-size: 12px;
    text-align: right;
}

.start-menu {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px,95vw);
    padding: 25px;
    background: #17243bf2;
    backdrop-filter: blur(25px);
    border: 1px solid #ffffff30;
    border-radius: 14px;
    display: none;
    z-index: 9999;
    box-shadow: 0 15px 50px #0007;
}

.start-menu h2 { font-weight: 500; }

.app-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.app-item {
    background: #ffffff12;
    border: 0;
    color: white;
    border-radius: 9px;
    padding: 18px 5px;
    cursor: pointer;
    font-size: 14px;
}

.app-item:hover { background: #ffffff30; }

.window {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: min(650px,90vw);
    height: min(420px,65vh);
    min-width: 280px;
    min-height: 180px;
    background: #17243b;
    border: 1px solid #ffffff35;
    border-radius: 12px;
    box-shadow: 0 20px 70px #0008;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    resize: both;
}

.window.maximized {
    resize: none;
    border-radius: 0;
}

.titlebar {
    height: 42px;
    min-height: 42px;
    background: #253653;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 14px;
    cursor: grab;
}

.titlebar:active { cursor: grabbing; }

.titlebar button {
    width: 43px;
    height: 42px;
    background: transparent;
    color: white;
    border: none;
    cursor: pointer;
}

.titlebar button:hover { background: #ffffff30; }
.titlebar .close:hover { background: #d33; }

.window-content {
    padding: 20px;
    overflow: auto;
    flex: 1;
}

.window-content button,
.window-content input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ffffff30;
    background: #263c5c;
    color: white;
    margin: 5px;
}

.window-content button { cursor: pointer; }
.window-content button:hover { background: #38567c; }

.window-content input {
    max-width: 90%;
}

.terminal {
    background: #050b12;
    height: 100%;
    padding: 12px;
    font-family: Consolas, monospace;
    color: #6dff9a;
    overflow: auto;
}

.terminal input {
    width: 80%;
    background: transparent;
    border: none;
    outline: none;
    font-family: Consolas, monospace;
}

.file {
    display: inline-block;
    padding: 18px;
    margin: 8px;
    background: #ffffff12;
    border-radius: 8px;
}

/* ANMELDEBEREICH */

.auth-screen {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        radial-gradient(circle at top, #244c7d, transparent 55%),
        linear-gradient(135deg, #07111f, #101b3c);
}

.auth-panel {
    width: min(420px, 100%);
    padding: 35px;
    text-align: center;
    background: #17243bf2;
    border: 1px solid #ffffff30;
    border-radius: 18px;
    box-shadow: 0 20px 70px #0009;
}

.auth-logo {
    font-size: 55px;
    color: #56b4ff;
}

.auth-panel h1 {
    letter-spacing: 5px;
    margin-bottom: 5px;
}

.auth-panel p {
    color: #b9c8dd;
}

.auth-panel form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 25px;
}

.auth-panel input {
    width: 100%;
    padding: 14px;
    color: white;
    background: #0b1729;
    border: 1px solid #ffffff30;
    border-radius: 8px;
    outline: none;
    margin: 0;
}

.auth-panel input:focus {
    border-color: #56b4ff;
}

.auth-panel form button {
    padding: 14px;
    color: white;
    background: #1676c5;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.auth-panel form button:hover {
    background: #258fe5;
}

.auth-panel form button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.auth-switch {
    margin-top: 20px;
    background: transparent;
    border: 0;
    color: #70bdff;
    cursor: pointer;
}

.auth-error {
    min-height: 20px;
    color: #ff8585 !important;
    font-size: 13px;
}

#accountInfo {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ffffff25;
    font-size: 13px;
    color: #c5d5e9;
}

#logoutButton {
    margin-top: 10px;
    padding: 9px 14px;
    color: white;
    background: #9b3434;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}

/* DESKTOP NUR NACH LOGIN */

body:not(.authenticated) .desktop,
body:not(.authenticated) .taskbar,
body:not(.authenticated) .start-menu {
    display: none;
}

body.authenticated #authScreen {
    display: none;
}

@media(max-width:600px) {
    .clock { display: none; }
    .window { width: 94vw; }
    .auth-panel { padding: 25px; }
}
</style>
</head>

<body>

<!-- LOGIN UND REGISTRIERUNG -->

<div id="authScreen" class="auth-screen">
    <div class="auth-panel">

        <div class="auth-logo">◈</div>

        <h1>NEXUS OS</h1>

        <p id="authSubtitle">
            Melde dich bei deinem NEXUS-Konto an.
        </p>

        <form id="authForm">

            <input
                id="authUsername"
                type="text"
                placeholder="Benutzername"
                minlength="3"
                maxlength="20"
                autocomplete="username"
                required
            >

            <input
                id="authPassword"
                type="password"
                placeholder="Passwort"
                minlength="8"
                maxlength="128"
                autocomplete="current-password"
                required
            >

            <button id="authSubmit" type="submit">
                Anmelden
            </button>

        </form>

        <p id="authError" class="auth-error"></p>

        <button class="auth-switch" id="authSwitch" type="button">
            Noch kein Konto? Registrieren
        </button>

    </div>
</div>

<!-- DESKTOP -->

<div class="desktop">

    <div class="desktop-icon" onclick="openApp('files')">
        <div class="symbol">📁</div>
        <p>Dateien</p>
    </div>

    <div class="desktop-icon" onclick="openApp('browser')">
        <div class="symbol">🌐</div>
        <p>Browser</p>
    </div>

    <div class="desktop-icon" onclick="openApp('settings')">
        <div class="symbol">⚙️</div>
        <p>Einstellungen</p>
    </div>

    <div class="desktop-icon" onclick="openApp('terminal')">
        <div class="symbol">⌨️</div>
        <p>Terminal</p>
    </div>

</div>

<!-- STARTMENÜ -->

<div class="start-menu" id="startMenu">

    <h2>NEXUS OS</h2>
    <p>Angeheftete Apps</p>

    <div class="app-grid">

        <button class="app-item" onclick="openApp('files')">
            📁<br>Dateien
        </button>

        <button class="app-item" onclick="openApp('browser')">
            🌐<br>Browser
        </button>

        <button class="app-item" onclick="openApp('settings')">
            ⚙️<br>Einstellungen
        </button>

        <button class="app-item" onclick="openApp('terminal')">
            ⌨️<br>Terminal
        </button>

        <button class="app-item" onclick="openApp('about')">
            💻<br>Über NEXUS
        </button>

    </div>

    <div id="accountInfo">
        Angemeldet als:
        <strong id="accountUsername"></strong>
        <br>
        <button id="logoutButton" onclick="logout()">
            Abmelden
        </button>
    </div>

</div>

<!-- TASKLEISTE -->

<div class="taskbar">

    <button class="task-button" onclick="toggleStart()">⊞</button>

    <div class="open-apps" id="openApps"></div>

    <div class="clock" id="clock"></div>

</div>

<script>

/* ==================================
   ANMELDUNG UND BENUTZERKONTEN
================================== */

let authMode = "login";

function setAuthMode(mode) {
    authMode = mode;

    document.getElementById("authSubtitle").textContent =
        mode === "login"
            ? "Melde dich bei deinem NEXUS-Konto an."
            : "Erstelle dein persönliches NEXUS-Konto.";

    document.getElementById("authSubmit").textContent =
        mode === "login" ? "Anmelden" : "Konto erstellen";

    document.getElementById("authSwitch").textContent =
        mode === "login"
            ? "Noch kein Konto? Registrieren"
            : "Du hast schon ein Konto? Anmelden";

    document.getElementById("authPassword").autocomplete =
        mode === "login" ? "current-password" : "new-password";

    document.getElementById("authError").textContent = "";
}

document.getElementById("authSwitch").addEventListener("click", () => {
    setAuthMode(authMode === "login" ? "register" : "login");
});

document.getElementById("authForm").addEventListener("submit", async event => {
    event.preventDefault();

    const username = document.getElementById("authUsername").value.trim();
    const password = document.getElementById("authPassword").value;

    const errorElement = document.getElementById("authError");
    const submitButton = document.getElementById("authSubmit");

    errorElement.textContent = "";
    submitButton.disabled = true;
    submitButton.textContent = "Bitte warten ...";

    try {
        const response = await fetch(
            authMode === "login"
                ? "/api/auth/login"
                : "/api/auth/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "Anmeldung fehlgeschlagen."
            );
        }

        await enterDesktop(result.username);

    } catch (error) {
        errorElement.textContent = error.message;
    } finally {
        submitButton.disabled = false;
        submitButton.textContent =
            authMode === "login"
                ? "Anmelden"
                : "Konto erstellen";
    }
});

async function enterDesktop(username) {
    document.body.classList.add("authenticated");

    document.getElementById("accountUsername").textContent = username;

    await loadCloudSettings();
}

async function checkLogin() {
    try {
        const response = await fetch("/api/auth/me", {
            credentials: "same-origin"
        });

        const result = await response.json();

        if (result.authenticated) {
            await enterDesktop(result.username);
        } else {
            document.body.classList.remove("authenticated");
        }

    } catch (error) {
        console.error("Login konnte nicht geprüft werden:", error);

        document.getElementById("authError").textContent =
            "Verbindung zum NEXUS-Server fehlgeschlagen.";
    }
}

async function logout() {
    try {
        await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "same-origin"
        });

    } catch (error) {
        console.error("Logout fehlgeschlagen:", error);

    } finally {
        Object.keys(windows).forEach(closeWindow);

        document.body.classList.remove("authenticated");

        document.getElementById("startMenu").style.display = "none";
        document.getElementById("authPassword").value = "";
        document.getElementById("authError").textContent = "";

        setAuthMode("login");
    }
}


/* ==================================
   APPS
================================== */

const apps = {
    files: {
        title: "Dateimanager",
        icon: "📁"
    },

    browser: {
        title: "NEXUS Browser",
        icon: "🌐"
    },

    settings: {
        title: "Einstellungen",
        icon: "⚙️"
    },

    terminal: {
        title: "NEXUS Terminal",
        icon: "⌨️"
    },

    about: {
        title: "Über NEXUS OS",
        icon: "💻"
    }
};

let windows = {};
let activeWindow = null;
let nextWindow = 1;
let zIndex = 100;

function toggleStart() {
    const menu = document.getElementById("startMenu");

    menu.style.display =
        menu.style.display === "block" ? "none" : "block";
}

function getAppContent(app) {

    if (app === "files") {
        return `
            <h2>📁 Dieser PC</h2>
            <div class="file">📂 Dokumente</div>
            <div class="file">📂 Bilder</div>
            <div class="file">📂 Downloads</div>
            <p>Dein NEXUS Dateimanager.</p>
        `;
    }

    if (app === "browser") {
        return `
            <h2>🌐 NEXUS Browser</h2>
            <p>Webadresse eingeben:</p>
            <input id="webaddress" placeholder="https://example.com">
            <button onclick="navigateWeb()">Öffnen</button>
            <p>Webseiten öffnen sich in einem neuen Browser-Tab.</p>
        `;
    }

    if (app === "settings") {
        return `
            <h2>⚙️ Einstellungen</h2>

            <h3>Personalisierung</h3>

            <button onclick="setBackground(1)">Blau</button>
            <button onclick="setBackground(2)">Dunkel</button>
            <button onclick="setBackground(3)">Lila</button>

            <h3>System</h3>
            <p>NEXUS OS Version 0.2</p>
        `;
    }

    if (app === "terminal") {
        return `
            <div class="terminal">
                <div id="terminalOutput">
                    NEXUS TERMINAL [Version 0.2]<br>
                    Schreibe help für Befehle.<br><br>
                </div>

                <span>NEXUS&gt; </span>

                <input
                    id="terminalInput"
                    placeholder="Befehl..."
                    onkeydown="if(event.key==='Enter') runCommand()"
                >
            </div>
        `;
    }

    if (app === "about") {
        return `
            <h2>💻 NEXUS OS</h2>
            <p>Version 0.2</p>
            <p>Ein eigenes Web-Betriebssystem.</p>
            <p>Entwickelt mit HTML, CSS und JavaScript.</p>
        `;
    }

    return "";
}


/* ==================================
   FENSTERVERWALTUNG
================================== */

function openApp(app) {

    document.getElementById("startMenu").style.display = "none";

    if (windows[app]) {
        restoreWindow(app);
        return;
    }

    const id = "window" + nextWindow++;

    const win = document.createElement("div");

    win.className = "window";
    win.id = id;

    win.innerHTML = `
        <div class="titlebar">

            <span>${apps[app].icon} ${apps[app].title}</span>

            <div>
                <button onclick="minimizeWindow('${app}')">—</button>
                <button onclick="maximizeWindow('${app}')">□</button>
                <button class="close" onclick="closeWindow('${app}')">×</button>
            </div>

        </div>

        <div class="window-content">
            ${getAppContent(app)}
        </div>
    `;

    document.body.appendChild(win);

    windows[app] = {
        element: win,
        id: id,
        minimized: false,
        maximized: false,
        previous: null
    };

    win.addEventListener("pointerdown", () => focusWindow(app));

    makeDraggable(win, app);
    createTaskButton(app);

    focusWindow(app);
}

function createTaskButton(app) {

    const button = document.createElement("button");

    button.className = "task-button";
    button.id = "task-" + app;
    button.title = apps[app].title;
    button.textContent = apps[app].icon;

    button.onclick = () => {

        if (!windows[app]) return;

        if (windows[app].minimized) {
            restoreWindow(app);
        } else if (activeWindow === app) {
            minimizeWindow(app);
        } else {
            focusWindow(app);
        }
    };

    document.getElementById("openApps").appendChild(button);
}

function focusWindow(app) {

    const data = windows[app];

    if (!data || data.minimized) return;

    activeWindow = app;

    data.element.style.zIndex = ++zIndex;

    updateTaskbar();
}

function updateTaskbar() {

    Object.keys(windows).forEach(app => {

        const button = document.getElementById("task-" + app);

        if (!button) return;

        button.classList.toggle(
            "active",
            app === activeWindow && !windows[app].minimized
        );
    });
}

function minimizeWindow(app) {

    const data = windows[app];

    if (!data) return;

    data.element.style.display = "none";
    data.minimized = true;

    if (activeWindow === app) {
        activeWindow = null;
    }

    updateTaskbar();
}

function restoreWindow(app) {

    const data = windows[app];

    if (!data) return;

    data.element.style.display = "flex";
    data.minimized = false;

    focusWindow(app);
}

function closeWindow(app) {

    const data = windows[app];

    if (!data) return;

    data.element.remove();

    delete windows[app];

    document.getElementById("task-" + app)?.remove();

    if (activeWindow === app) {
        activeWindow = null;

        const remaining = Object.keys(windows)
            .filter(name => !windows[name].minimized);

        if (remaining.length) {
            focusWindow(remaining[remaining.length - 1]);
        }
    }

    updateTaskbar();
}

function maximizeWindow(app) {

    const data = windows[app];

    if (!data) return;

    const win = data.element;

    if (!data.maximized) {

        data.previous = {
            top: win.style.top,
            left: win.style.left,
            width: win.style.width,
            height: win.style.height
        };

        win.classList.add("maximized");

        win.style.top = "0";
        win.style.left = "0";
        win.style.width = "100vw";
        win.style.height = "calc(100vh - 58px)";
        win.style.transform = "none";

        data.maximized = true;

    } else {

        win.classList.remove("maximized");

        win.style.top = data.previous.top;
        win.style.left = data.previous.left;
        win.style.width = data.previous.width;
        win.style.height = data.previous.height;
        win.style.transform = "none";

        data.maximized = false;
    }

    focusWindow(app);
}

function makeDraggable(win, app) {

    const bar = win.querySelector(".titlebar");

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.addEventListener("pointerdown", e => {

        if (e.target.tagName === "BUTTON") return;

        const data = windows[app];

        if (!data || data.maximized) return;

        dragging = true;

        focusWindow(app);

        const rect = win.getBoundingClientRect();

        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        win.style.transform = "none";

        bar.setPointerCapture(e.pointerId);
    });

    bar.addEventListener("pointermove", e => {

        if (!dragging) return;

        win.style.left = (e.clientX - offsetX) + "px";
        win.style.top = Math.max(0, e.clientY - offsetY) + "px";
    });

    bar.addEventListener("pointerup", () => {
        dragging = false;
    });

    bar.addEventListener("pointercancel", () => {
        dragging = false;
    });

    bar.addEventListener("dblclick", e => {

        if (e.target.tagName === "BUTTON") return;

        maximizeWindow(app);
    });
}


/* ==================================
   CLOUD-EINSTELLUNGEN
================================== */

async function setBackground(number, save = true) {

    const backgrounds = {
        1: "linear-gradient(135deg,#173b70,#101b3c)",
        2: "linear-gradient(135deg,#111827,#05070c)",
        3: "linear-gradient(135deg,#42206b,#111b46)"
    };

    if (!backgrounds[number]) return;

    document.body.style.background = backgrounds[number];

    if (save) {
        try {
            const response = await fetch("/api/data", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: "nexusBackground",
                    value: number
                })
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            console.log("NEXUS OS: Hintergrund gespeichert.");

        } catch (error) {
            console.error("Speichern fehlgeschlagen:", error);
        }
    }
}

async function loadCloudSettings() {

    try {
        const response = await fetch("/api/data", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        const background = data.find(
            item => item.key === "nexusBackground"
        );

        if (background) {
            setBackground(Number(background.value), false);
        } else {
            setBackground(1, false);
        }

    } catch (error) {
        console.error(
            "Cloud-Einstellungen konnten nicht geladen werden:",
            error
        );

        setBackground(1, false);
    }
}


/* ==================================
   BROWSER
================================== */

function navigateWeb() {

    const input = document.getElementById("webaddress");

    if (!input) return;

    let address = input.value.trim();

    if (!address) return;

    if (!/^https?:\/\//i.test(address)) {
        address = "https://" + address;
    }

    try {
        const url = new URL(address);

        if (!["http:", "https:"].includes(url.protocol)) return;

        window.open(url.href, "_blank", "noopener,noreferrer");

    } catch {
        alert("Ungültige Webadresse.");
    }
}


/* ==================================
   TERMINAL
================================== */

function runCommand() {

    const input = document.getElementById("terminalInput");
    const output = document.getElementById("terminalOutput");

    if (!input || !output) return;

    const command = input.value.trim().toLowerCase();

    let result = "";

    if (command === "help") {
        result = "Befehle: help, about, version, clear, date";
    }
    else if (command === "about") {
        result = "NEXUS OS - Web Operating System";
    }
    else if (command === "version") {
        result = "NEXUS OS 0.2";
    }
    else if (command === "date") {
        result = new Date().toLocaleString("de-DE");
    }
    else if (command === "clear") {
        output.innerHTML = "";
        input.value = "";
        return;
    }
    else if (command === "") {
        input.value = "";
        return;
    }
    else {
        result = "Unbekannter Befehl: " + command;
    }

    const line = document.createElement("div");

    line.textContent = "NEXUS> " + command + " | " + result;

    output.appendChild(line);

    input.value = "";

    output.parentElement.scrollTop =
        output.parentElement.scrollHeight;
}


/* ==================================
   UHR
================================== */

function updateClock() {

    const now = new Date();

    document.getElementById("clock").innerHTML =
        now.toLocaleTimeString("de-DE", {
            hour: "2-digit",
            minute: "2-digit"
        }) + "<br>" +
        now.toLocaleDateString("de-DE");
}


/* ==================================
   SYSTEMSTART
================================== */

checkLogin();

updateClock();

setInterval(updateClock, 1000);

</script>
